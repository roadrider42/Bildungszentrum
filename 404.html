<!DOCTYPE html>

<head>

<!--

    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 1.25rem;

    color: #2b3a42; background: #ffffff;
  }
  main { max-width: 32rem; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; margin: 0 0 .6em; color: #0b1a21; }
  p { color: #5b6c74; margin: 0 0 1.5rem; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: .875rem 1.5rem; border-radius: 6px;
    background: #17636b; color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { background: #0f5159; }
  a:focus-visible { outline: 3px solid #17636b; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Diese Seite gibt es nicht.</h1>
