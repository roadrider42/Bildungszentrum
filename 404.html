<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ERZEUGTE DATEI (aus werkzeug/vorlage-404.html und loginseite-texte.md).
  ABSICHTLICH KEINE KOPIE von index.html (gleiche Regel wie bei
  webseite-future-space/404.html): Eine Kopie veraltet und sieht echt aus. Wer
  sich verlaufen hat, kommt mit einem Druck zur Startseite zurück. Der
  noindex-Eintrag steht auch hier, er gilt je Datei, nicht je Auslieferung.
  Die Farben kommen beim Bauen aus dem :root-Block von vorlage.html; hier wird
  keine Farbe von Hand eingetragen.
-->
<meta name="robots" content="noindex, nofollow">
<title>Seite nicht gefunden · Bildungszentrum</title>
<style>
  :root {
    --text:          #495057;
    --stark:         #3d3d3d;
    --leise:         #6c757d;
    --akzent:        #bb2f28;
    --akzent-dunkel: #9f2822;
    --grund:         #ffffff;
    --hell:          #fcfbfa;
    --rand:          #dee2e6;
    --fuss:          #3d3d3d;
    --fuss-link:     #fcfbfa;
  }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 1.25rem;
    font: 17px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text); background: var(--grund);
  }
  main { max-width: 32rem; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; margin: 0 0 .6em; color: var(--stark); }
  p { color: var(--leise); margin: 0 0 1.5rem; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: .875rem 1.5rem; border-radius: 6px;
    background: var(--akzent); color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { background: var(--akzent-dunkel); }
  a:focus-visible { outline: 3px solid var(--akzent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht hat sich in der Adresse etwas verschrieben.</p>
  <a href="/">Zur Startseite</a>
</main>
</body>
</html>
